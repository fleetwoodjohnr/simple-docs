appId: app.simpledocs.desktop
productName: Simple Docs
copyright: Copyright © Simple Docs contributors
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  - "!node_modules/@tesseract.js-data/eng/4.0.0/**"
asar: true
asarUnpack:
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**
  - node_modules/@tesseract.js-data/eng/4.0.0_best_int/**
fileAssociations:
  - ext: docx
    name: Word Document
    role: Editor
  - ext: odt
    name: OpenDocument Text
    role: Editor
  - ext: md
    name: Markdown
    role: Editor
  - ext: rtf
    name: Rich Text
    role: Editor
  - ext: txt
    name: Text
    role: Editor
  - ext: pdf
    name: PDF Document
    role: Editor
linux:
  target: [AppImage, deb, rpm]
  category: Office
  mimeTypes:
    - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    - application/vnd.oasis.opendocument.text
    - text/markdown
    - application/rtf
    - text/plain
    - application/pdf
win:
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: [dmg]
  category: public.app-category.productivity
