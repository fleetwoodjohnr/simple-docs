appId: app.simpledocs.desktop
productName: Simple Docs
copyright: Copyright © Simple Docs contributors
icon: resources/icon.png
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  - "!node_modules/@tesseract.js-data/eng/4.0.0/**"
  # The Node OCR worker loads <variant>.js + <variant>.wasm; the *.wasm.js files are browser builds with the wasm inlined (~23 MB)
  - "!node_modules/tesseract.js-core/*.wasm.js"
asar: true
# The OCR worker thread starts from app.asar.unpacked, so tesseract.js and everything it requires must be there.
asarUnpack:
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**
  - node_modules/@tesseract.js-data/eng/4.0.0_best_int/**
  - node_modules/{bmp-js,idb-keyval,is-url,node-fetch,punycode,regenerator-runtime,tr46,wasm-feature-detect,webidl-conversions,whatwg-url,zlibjs}/**
  - node_modules/@exodus/bytes/**
fileAssociations:
  - ext: docx
    name: Word Document
    role: Editor
  - ext: odt
    name: OpenDocument Text
    role: Editor
  - ext: md
    name: Markdown
    role: Editor
  - ext: rtf
    name: Rich Text
    role: Editor
  - ext: txt
    name: Text
    role: Editor
  - ext: pdf
    name: PDF Document
    role: Editor
linux:
  # deb/rpm also need `homepage` and `author.email` in package.json (and rpmbuild): see RELEASE.md
  target: [AppImage]
  syncDesktopName: true
  icon: resources/icon.png
  category: Office
  mimeTypes:
    - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    - application/vnd.oasis.opendocument.text
    - text/markdown
    - application/rtf
    - text/plain
    - application/pdf
win:
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: [dmg]
  category: public.app-category.productivity
