appId: app.simpledocs.desktop
productName: Simple Docs
copyright: Copyright © Simple Docs contributors
icon: resources/icon.png
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  - "!node_modules/@tesseract.js-data/eng/4.0.0/**"
  # The Node OCR worker loads <variant>.js + <variant>.wasm; the *.wasm.js files are browser builds with the wasm inlined (~23 MB)
  - "!node_modules/tesseract.js-core/*.wasm.js"
asar: true
# The OCR worker thread starts from app.asar.unpacked, so tesseract.js and everything it requires must be there.
asarUnpack:
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**
  - node_modules/@tesseract.js-data/eng/4.0.0_best_int/**
  - node_modules/{bmp-js,idb-keyval,is-url,node-fetch,punycode,regenerator-runtime,tr46,wasm-feature-detect,webidl-conversions,whatwg-url,zlibjs}/**
  - node_modules/@exodus/bytes/**
fileAssociations:
  - ext: docx
    name: Word Document
    role: Editor
  - ext: odt
    name: OpenDocument Text
    role: Editor
  - ext: md
    name: Markdown
    role: Editor
  - ext: rtf
    name: Rich Text
    role: Editor
  - ext: txt
    name: Text
    role: Editor
  - ext: pdf
    name: PDF Document
    role: Editor
linux:
  # deb and rpm take the maintainer and homepage from package.json; rpm also needs rpmbuild (RELEASE.md)
  target: [AppImage, deb, rpm]
  syncDesktopName: true
  # one PNG per size: the hicolor theme has no 1024x1024 directory, so a lone 1024 px icon is never found
  icon: resources/icons
  category: Office
  mimeTypes:
    - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    - application/vnd.oasis.opendocument.text
    - text/markdown
    - application/rtf
    - text/plain
    - application/pdf
deb:
  # electron-builder's default list plus ALSA and GBM, which Electron links against (absent on minimal installs)
  depends: [libgtk-3-0, libnotify4, libnss3, libxss1, libxtst6, xdg-utils, libatspi2.0-0, libuuid1, libsecret-1-0, libgbm1, "libasound2t64 | libasound2"]
rpm:
  # electron-builder's default list plus ALSA, GBM and libsecret (keyring for the AI key), absent on minimal installs
  depends: [gtk3, libnotify, nss, libXScrnSaver, "(libXtst or libXtst6)", xdg-utils, at-spi2-core, "(libuuid or libuuid1)", alsa-lib, mesa-libgbm, libsecret]
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Apple's icon grid: an 824 px tile inset 100 px, with a shadow (npm run icons)
  icon: resources/icon-mac.png
  category: public.app-category.productivity
  # Unsigned: Apple Silicon only runs signed code, so sign ad hoc. With a Developer ID certificate, remove both lines.
  identity: "-"
  hardenedRuntime: false
