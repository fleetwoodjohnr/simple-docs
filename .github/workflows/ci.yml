# Build and test on Linux, Windows and macOS, then install the deb and rpm into clean Ubuntu and Fedora containers.
# Tags (v*) also draft a GitHub release with the installers and the latest*.yml files the in-app updater reads
# (it only sees the release once the draft is published).
# Builds are unsigned (see RELEASE.md): macOS gets an ad-hoc signature so Apple Silicon will run it.
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run in progress; tag runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # poppler (pdftotext, pdftoppm) lets the tests check exported PDFs; LibreOffice is the independent DOCX/ODT reader (Calc reads the chart workbooks).
      - name: Test tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb poppler-utils libreoffice-writer libreoffice-calc rpm
      - name: Test tools (macOS)
        if: runner.os == 'macOS'
        run: brew install poppler
      - name: Test tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-x86_64-poppler
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: End-to-end tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npx playwright test; else npx playwright test; fi

      - name: Installers
        run: npx electron-builder --publish never

      - name: End-to-end tests against the packaged app
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) SD_PACKAGED="$PWD/release/linux-unpacked/simple-docs" xvfb-run -a npx playwright test ;;
            Windows) SD_PACKAGED="$PWD/release/win-unpacked/Simple Docs.exe" npx playwright test ;;
            macOS) SD_PACKAGED="$PWD/release/mac-arm64/Simple Docs.app/Contents/MacOS/Simple Docs" npx playwright test ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-${{ runner.os }}
          path: test-results/

  # The deb and rpm declare their dependencies by hand (electron-builder.yml): every library must resolve on a clean install.
  linux-install:
    name: install on ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            install: apt-get update -qq && apt-get install -y -qq ./dist/*.deb
          - image: ubuntu:24.04
            install: apt-get update -qq && apt-get install -y -qq ./dist/*.deb
          - image: ubuntu:26.04
            install: apt-get update -qq && apt-get install -y -qq ./dist/*.deb
          - image: fedora:44
            install: dnf install -y -q ./dist/*.rpm /usr/bin/ldd
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: installers-Linux
          path: dist
      - run: ${{ matrix.install }}
      - name: Every shared library resolves
        run: |
          ldd "/opt/Simple Docs/simple-docs" > ldd.txt
          ! grep "not found" ldd.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, linux-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: installers-*
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The in-app updater downloads the names written in latest*.yml, where spaces are dashes
          for f in dist/*' '*; do [ -e "$f" ] && mv "$f" "${f// /-}"; done
          # Notes: the newest CHANGELOG section
          awk '/^## /{n++} n==1' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --draft --title "Simple Docs ${GITHUB_REF_NAME#v}" --notes-file notes.md
